document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"511c9c77-fb09-48c2-a589-413d500f553f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Instrument Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"25b86735-d38b-4289-9552-31adaeec3ef6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:#f6f4ef;color:#12161d;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#b3122b;text-decoration:none}\na:hover{color:#8e0e22}\ndetails summary::-webkit-details-marker{display:none}\ndetails[open] .plus{transform:rotate(45deg)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;font-feature-settings:'tnum' 1\">\n\n<header style=\"position:sticky;top:0;z-index:20;background:rgba(15,19,26,0.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.08)\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px\">\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <span style=\"font-family:'Instrument Serif',serif;font-size:22px;color:#f6f4ef;letter-spacing:0.01em\">Kemuel Godoy<\u002Fspan>\n      <span style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#a9aeb8\">Consultor Financeiro · Ademicon<\u002Fspan>\n    <\u002Fdiv>\n    <a href=\"{{ waGeral }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;background:#c4142f;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500\" style-hover=\"background:#a50f27;color:#fff\">Simular no WhatsApp<\u002Fa>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section data-screen-label=\"01 Hero\" style=\"background:#0f131a;color:#f6f4ef;overflow:hidden\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(48px,8vw,104px) 24px clamp(56px,8vw,96px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(40px,6vw,80px);align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:28px\">\n      <span style=\"font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#d9b77a\">Consultoria exclusiva em consórcio<\u002Fspan>\n      <sc-if value=\"{{ isGeral }}\" hint-placeholder-val=\"{{ true }}\">\n        <h1 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(44px,6.2vw,80px);line-height:1;letter-spacing:-0.01em;text-wrap:balance\">Seu imóvel, seu carro, seus planos. <em style=\"color:#e9cf9f\">Sem juros de financiamento.<\u002Fem><\u002Fh1>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isImoveis }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(44px,6.2vw,80px);line-height:1;letter-spacing:-0.01em;text-wrap:balance\">A casa própria sem pagar <em style=\"color:#e9cf9f\">juros de financiamento ao banco.<\u002Fem><\u002Fh1>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isVeiculos }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(44px,6.2vw,80px);line-height:1;letter-spacing:-0.01em;text-wrap:balance\">Seu próximo carro, <em style=\"color:#e9cf9f\">sem os juros do financiamento.<\u002Fem><\u002Fh1>\n      <\u002Fsc-if>\n      <p style=\"margin:0;font-size:clamp(17px,1.6vw,20px);line-height:1.55;color:#c9cdd4;max-width:540px;text-wrap:pretty\">Com o consórcio Ademicon e uma consultoria individual, você planeja a sua conquista com parcelas reduzidas até a contemplação, e o dinheiro que iria para os juros continua com você.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <a href=\"{{ waGeral }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;justify-content:center;background:#c4142f;color:#fff;padding:18px 28px;border-radius:999px;font-size:16px;font-weight:500;min-height:24px\" style-hover=\"background:#a50f27;color:#fff\">Quero minha simulação gratuita<\u002Fa>\n        <a href=\"#produtos\" style=\"display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(246,244,239,0.28);color:#f6f4ef;padding:18px 26px;border-radius:999px;font-size:16px\" style-hover=\"border-color:#f6f4ef;color:#fff\">Ver cartas de crédito<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px 28px;padding-top:8px;font-size:14px;color:#a9aeb8\">\n        <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:6px;height:6px;background:#d9b77a;transform:rotate(45deg)\"><\u002Fspan>Sem juros<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:6px;height:6px;background:#d9b77a;transform:rotate(45deg)\"><\u002Fspan>Parcelas reduzidas até a contemplação<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:6px;height:6px;background:#d9b77a;transform:rotate(45deg)\"><\u002Fspan>Atendimento direto pelo WhatsApp<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative;max-width:480px;width:100%;justify-self:center\">\n      <div style=\"position:absolute;inset:24px -24px -24px 24px;border:1px solid rgba(217,183,122,0.45);border-radius:4px\"><\u002Fdiv>\n      <img src=\"271c54b8-2dac-44a9-8384-aae891c8e824\" alt=\"Kemuel Godoy, consultor financeiro Ademicon\" style=\"position:relative;display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 30%;border-radius:4px;filter:saturate(0.9)\">\n      <div style=\"position:absolute;left:-1px;bottom:28px;background:#f6f4ef;color:#12161d;padding:16px 20px;display:flex;flex-direction:column;gap:4px;border-radius:0 4px 4px 0;box-shadow:0 20px 40px rgba(0,0,0,0.3)\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:22px;line-height:1\">Kemuel Godoy<\u002Fspan>\n        <span style=\"font-size:13px;color:#5a5f68\">Planejamento patrimonial sem juros<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"02 Comparativo\" style=\"background:#f6f4ef\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(64px,9vw,120px) 24px;display:flex;flex-direction:column;gap:48px\">\n    <div style=\"display:flex;flex-direction:column;gap:16px;max-width:760px\">\n      <span style=\"font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#b3122b\">A conta que o banco não mostra<\u002Fspan>\n      <h2 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(36px,4.6vw,58px);line-height:1.05;text-wrap:balance\">No financiamento você paga pelo bem e pelos juros. No consórcio, só pelo que é seu.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:1px;background:#d9d5cc;border:1px solid #d9d5cc;border-radius:6px;overflow:hidden\">\n      <div style=\"background:#efece5;padding:36px;display:flex;flex-direction:column;gap:20px\">\n        <span style=\"font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#5a5f68\">Financiamento tradicional<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:1.45;color:#3c414a\">\n          <span>Juros cobrados todos os meses sobre o saldo devedor<\u002Fspan>\n          <span>Valor final muito acima do preço do bem<\u002Fspan>\n          <span>Entrada geralmente exigida<\u002Fspan>\n          <span>Aprovação condicionada às regras do banco<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#12161d;color:#f6f4ef;padding:36px;display:flex;flex-direction:column;gap:20px\">\n        <span style=\"font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:#d9b77a\">Consórcio Ademicon com Kemuel<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:1.45\">\n          <span>Sem juros: apenas taxa de administração diluída nas parcelas<\u002Fspan>\n          <span>Parcela reduzida até a contemplação<\u002Fspan>\n          <span>Sem entrada obrigatória<\u002Fspan>\n          <span>Carta de crédito com poder de compra à vista<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"kemuel\" data-screen-label=\"03 Quem é Kemuel\" style=\"background:#fff;border-top:1px solid #e6e2d9;border-bottom:1px solid #e6e2d9\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(64px,9vw,120px) 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:clamp(40px,6vw,88px);align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:28px\">\n      <span style=\"font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#b3122b\">Quem vai cuidar do seu planejamento<\u002Fspan>\n      <h2 style=\"margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(36px,4.6vw,58px);line-height:1.05;text-wrap:balance\">Consórcio não é sorte. <em>É estratégia.<\u002Fem><\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:18px;font-size:18px;line-height:1.6;color:#3c414a;max-width:560px\">\n        <p style=\"margin:0;text-wrap:pretty\">Sou Kemuel Godoy, consultor financeiro da Ademicon e especialista em consórcio imobiliário e automotivo. Meu trabalho começa antes da venda: entender o seu momento, a sua renda e o seu objetivo.<\u002Fp>\n        <p style=\"margin:0;text-wrap:pretty\">A partir disso, desenho a carta de crédito certa, com uma parcela que cabe no seu mês e um plano claro para chegar à contemplação. Você fala direto comigo, do primeiro contato até a compra do bem.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"{{ waGeral }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;display:inline-flex;background:#12161d;color:#f6f4ef;padding:16px 26px;border-radius:999px;font-size:15px;font-weight:500\" style-hover=\"background:#000;color:#fff\">Falar com o Kemuel agora<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-top:1px solid #12161d\">\n      <div style=\"display:grid;grid-template-columns:56px 1fr;gap:16px;padding:28px 0;border-bottom:1px solid #e6e2d9\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:32px;color:#b3122b;line-height:1\">01<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:19px;font-weight:500\">Diagnóstico pelo WhatsApp<\u002Fspan><span style=\"font-size:16px;line-height:1.5;color:#5a5f68\">Uma conversa rápida para entender o que você quer conquistar e em quanto tempo.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:56px 1fr;gap:16px;padding:28px 0;border-bottom:1px solid #e6e2d9\">\n        <span style=\"font-family:'Instrument Serif',serif;font-size:32px;color:#b3122b;line-height:1\">02<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:19px;font-weight:500\">Simulação personalizada<\u002Fspan><span style=\"font-size:16px;line-height:1.5;color:#5a5f68\">Comparo créditos, prazos e parcelas e mostro a opção que faz sentido para você.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gr celas reduzidas até a contemplação.',\n        benefits: ['Crédito de R$ 200 mil a R$ 1 milhão', 'Sem juros de financiamento', 'Parcelas reduzidas até a contemplação', 'Compra à vista: mais poder de negociação'],\n        uses: [], parcelaLabel: 'Parcela reduzida*', cta: 'Simular consórcio de imóvel',\n        rows: [['R$ 200.000', 'R$ 674,55'], ['R$ 400.000', 'R$ 1.349,09'], ['R$ 500.000', 'R$ 1.686,36'], ['R$ 750.000', 'R$ 2.529,55'], ['R$ 1.000.000**', 'R$ 3.600,00']],\n        note: note + ' **Composição de cotas.', msg: 'Olá, Kemuel! Vim pela sua página e quero simular um consórcio de imóvel.' },\n      veiculos: { label: 'Veículos', title: 'Consórcio de Veículos', desc: 'Conquiste seu carro, inclusive elétrico ou híbrido. Uma forma inteligente de adquirir seu veículo sem juros, com parcelas acessíveis até a contemplação.',\n        benefits: ['Crédito de R$ 40 mil a R$ 250 mil', 'Sem juros de financiamento', 'Parcelas que cabem no planejamento', 'Novo, seminovo, elétrico ou híbrido'],\n        uses: [], parcelaLabel: 'Parcela*', cta: 'Simular consórcio de veículo',\n        rows: [['R$ 40.000', 'R$ 516,44'], ['R$ 80.000', 'R$ 1.032,89'], ['R$ 120.000', 'R$ 1.549,33'], ['R$ 160.000', 'R$ 2.065,78'], ['R$ 250.000', 'R$ 3.227,78']],\n        note: '*Parcelas lineares calculadas com base no fundo comum até a contemplação, quando será recalculada. Consulte grupos e cotas disponíveis. Valores sujeitos a alteração.', msg: 'Olá, Kemuel! Vim pela sua página e quero simular um consórcio de veículo.' },\n      servicos: { label: 'Serviços', title: 'Consórcio de Serviços', desc: 'Planeje formatura, viagem, intercâmbio ou aquele procedimento que você adia há tempos, com organização, estratégia financeira e sem juros.',\n        benefits: ['Crédito de R$ 15 mil a R$ 30 mil', 'Parcelas reduzidas a partir de R$ 297,60', 'Sem juros de financiamento', 'Alternativa estratégica ao cartão e ao empréstimo'],\n        usesLabel: 'Ideal para', uses: ['Festa e viagem de formatura', 'Viagens nacionais e internacionais', 'Intercâmbio', 'Implantes, estética e tratamentos odontológicos'],\n        parcelaLabel: 'Parcela reduzida*', cta: 'Simular consórcio de serviços',\n        rows: [['R$ 15.000', 'R$ 297,60'], ['R$ 20.000', 'R$ 396,80'], ['R$ 25.000', 'R$ 496,00'], ['R$ 30.000', 'R$ 595,20']],\n        note: note, msg: 'Olá, Kemuel! Vim pela sua página e quero simular um consórcio de serviços.' },\n      agro: { label: 'Agro e Empresas', title: 'Consórcio para Agro e Empresas', desc: 'Invista no maquinário certo, em tecnologia ou na estrutura da sua clínica. Uma forma inteligente de fazer o negócio crescer sem juros, com parcelas reduzidas até a contemplação.',\n        benefits: ['Colheitadeiras, tratores e maquinário agrícola', 'Clínica e equipamentos: crédito de R$ 200 mil a partir de R$ 1.774,56', 'Tecnologia e equipamentos: crédito de R$ 180 mil a partir de R$ 1.597,11', 'Agro: crédito de R$ 100 mil a partir de R$ 887,28'],\n        uses: [], parcelaLabel: 'Parcela reduzida*', cta: 'Simular para o meu negócio',\n        rows: [['R$ 80.000', 'R$ 557,76'], ['R$ 152.000', 'R$ 1.059,74'], ['R$ 251.450', 'R$ 1.570,20'], ['R$ 352.030', 'R$ 2.198,28'], ['R$ 503.276', 'R$ 3.080,90']],\n        note: '*Linha Agro. Parcela reduzida até a contemplação ou por 24 meses, o que acontecer antes, quando será recalculada. Valores sujeitos a alteração.', msg: 'Olá, Kemuel! Vim pela sua página e quero simular um consórcio para o meu negócio.' }\n    };\n    const cur = P[this.state.tab];\n    const tabs = Object.keys(P).map(k => {\n      const on = k === this.state.tab;\n      return { label: P[k].label, select: () => this.setState({ tab: k }), bg: on ? '#12161d' : 'transparent', color: on ? '#f6f4ef' : '#12161d', border: on ? '#12161d' : '#cfcac0' };\n    });\n    const packs = [['3 cotas de R$ 100 mil', '300 mil', 'R$ 1.020,00', 'R$ 90 a 120 mil'], ['5 cotas de R$ 100 mil', '500 mil', 'R$ 1.710,00', 'R$ 150 a 200 mil'], ['10 cotas de R$ 100 mil', '1 milhão', 'R$ 3.500,00', 'R$ 300 a 400 mil']]\n      .map(([cotas, credito, parcela, valor]) => ({ cotas, credito: 'R$ ' + credito, parcela, valor, wa: this.wa('Olá, Kemuel! Tenho interesse no Pacote Investidor de R$ ' + credito + '.') }));\n    return {\n      isGeral: foco !== 'imoveis' && foco !== 'veiculos', isImoveis: foco === 'imoveis', isVeiculos: foco === 'veiculos',\n      showFloating: this.props.showFloating ?? true,\n      waGeral: this.wa('Olá, Kemuel! Vim pela sua página e quero fazer uma simulação de consórcio.'),\n      tabs,\n      p: { ...cur, wa: this.wa(cur.msg), hasUses: cur.uses.length > 0, rows: cur.rows.map(([c, p]) => ({ c, p })) },\n      packs,\n      faq: [\n        { q: 'Consórcio tem juros?', a: 'Não. No consórcio você paga uma taxa de administração diluída nas parcelas, sem os juros cobrados mês a mês em um financiamento.' },\n        { q: 'Como funciona a contemplação?', a: 'Todo mês o grupo realiza assembleias com sorteio e lance. Ao ser contemplado, você recebe a carta de crédito e compra o bem à vista.' },\n        { q: 'O que é parcela reduzida?', a: 'Até a contemplação você paga uma parcela menor, calculada sobre um fundo comum reduzido. Depois de contemplado, a parcela é recalculada.' },\n        { q: 'Posso antecipar minha contemplação?', a: 'Sim, por meio de lance. Eu acompanho os grupos e monto com você uma estratégia de lance de acordo com o seu objetivo e o seu caixa.' },\n        { q: 'A simulação tem custo?', a: 'Não. A simulação e a consultoria são gratuitas e sem compromisso. Basta chamar no WhatsApp.' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
